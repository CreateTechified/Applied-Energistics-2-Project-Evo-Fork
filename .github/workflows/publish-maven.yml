name: Publish to GitHub Packages
on:
  push:
    branches: ["1.21.1"]
  workflow_dispatch:
concurrency:
  group: publish-maven
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Read version
        id: ver
        run: |
          VERSION=$(grep -E '^version=' gradle.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]')
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)*$ ]]; then
            echo "Invalid or missing version '$VERSION' in gradle.properties"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing org.appliedenergistics:appliedenergistics2:$VERSION"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew publishMavenPublicationToGitHubPackagesRepository 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # GitHub Packages refuses to overwrite an existing version (HTTP 409).
            if grep -qiE "status code 409|Conflict" publish.log; then
              echo "::notice::Version ${{ steps.ver.outputs.version }} is already published, skipping. Bump 'version' in gradle.properties to publish a new one."
              exit 0
            fi
            exit "$status"
          fi