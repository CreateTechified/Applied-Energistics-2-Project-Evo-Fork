name: Java CI with Gradle

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run the pull-request build if opened from another repository,
    # since branch pushes already run this workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch Tags
        run: git fetch origin --tags
        shell: bash

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Assets
        if: github.event_name == 'push'
        run: ./gradlew runData

      - name: Check That Datagen Ran
        if: github.event_name == 'push'
        run: test -d ./src/generated/resources/.cache

      - name: Make Sure Generated Files Are Up-to-Date
        if: github.event_name == 'push'
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then exit 1; fi

      - uses: burrunan/gradle-cache-action@v3
        name: Build Project
        with:
          job-id: jdk21
          arguments: printProjectVersion build --max-workers 1
          gradle-version: wrapper
          concurrent: true
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Run Game Tests
        if: github.event_name == 'push'
        run: ./gradlew runGametest

      - name: Resolve Release Info
        id: release_info
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.1'
        shell: bash
        run: |
            # 1. Try reading mod_version directly from gradle.properties
            RAW_VERSION=$(grep -E '^[[:space:]]*mod_version[[:space:]]*=' gradle.properties | head -n 1 | cut -d'=' -f2- | tr -d '[:space:]' || true)
            
            # 2. Fallback to Gradle task, extracting only the semver/version token (e.g. 19.2.21-alpha.12+1.21.1)
            if [ -z "$RAW_VERSION" ]; then
              RAW_VERSION=$(./gradlew -q printProjectVersion | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)*' | tail -n 1 || true)
            fi
            
            # 3. Check git tag on HEAD (also strip any accidental Projectversion prefix just in case)
            TAG=$(git tag --points-at HEAD | head -n 1 | sed -E 's/^Project[[:space:]]*version:[[:space:]]*//i' | tr -d '[:space:]' || true)
            
            RELEASE_TAG="${TAG:-$RAW_VERSION}"
            
            if [ -z "$RELEASE_TAG" ]; then
              echo "ERROR: Could not resolve a valid release version or tag."
              exit 1
            fi
            
            LOWER_CHECK=$(printf '%s %s' "$RAW_VERSION" "$TAG" | tr '[:upper:]' '[:lower:]')
            if [[ "$LOWER_CHECK" == *alpha* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
            
            echo "Resolved version: '$RAW_VERSION' | tag: '$TAG' | release_tag: '$RELEASE_TAG' | prerelease: '$PRERELEASE'"
            echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.1'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}