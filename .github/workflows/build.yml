name: Java CI with Gradle

on:
  push:
    branches: ["1.21.1"]
  pull_request:
    branches: ["1.21.1"]

concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run the pull-request build if opened from another repository,
    # since branch pushes already run this workflow.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Fetch Tags
        run: git fetch origin --tags
        shell: bash

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Assets
        if: github.event_name == 'push'
        run: ./gradlew runData

      - name: Check That Datagen Ran
        if: github.event_name == 'push'
        run: test -d ./src/generated/resources/.cache

      - name: Make Sure Generated Files Are Up-to-Date
        if: github.event_name == 'push'
        run: |
          git status
          if [ -n "$(git status --porcelain)" ]; then exit 1; fi

      - uses: burrunan/gradle-cache-action@v3
        name: Build Project
        with:
          job-id: jdk21
          arguments: printProjectVersion build --max-workers 1
          gradle-version: wrapper
          concurrent: true
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_KEY_PASSWORD }}

      - name: Run Game Tests
        if: github.event_name == 'push'
        run: ./gradlew runGametest

      - name: Upload New Source Text Strings to Crowdin
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.1'
        run: ./gradlew uploadToCrowdin
        env:
          GIT_BRANCH: master
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_TOKEN }}
        continue-on-error: true

      - name: Merge Test Reports
        if: success() || failure()
        run: npx junit-report-merger junit.xml "**/TEST-*.xml"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: junit.xml

      - name: Resolve Release Info
        id: release_info
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.1'
        shell: bash
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]' || true)
          if [ -z "$VERSION" ]; then
            VERSION=$(./gradlew -q printProjectVersion | tail -n 1 | tr -d '[:space:]')
          fi

          TAG=$(git tag --points-at HEAD | head -n 1 || true)
          RELEASE_TAG="${TAG:-$VERSION}"

          LOWER_CHECK=$(printf '%s %s' "$VERSION" "$TAG" | tr '[:upper:]' '[:lower:]')
          if [[ "$LOWER_CHECK" == *alpha* ]]; then
            PRERELEASE="true"
          else
            PRERELEASE="false"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/1.21.1'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.tag }}
          draft: false
          prerelease: ${{ steps.release_info.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}